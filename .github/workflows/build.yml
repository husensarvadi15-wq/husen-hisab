name: Build Husen Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Specific Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Organize Android Project Files
        run: |
          mkdir -p app/src/main/java/com/sarvadiverse/husenhisab
          mkdir -p app/src/main/res/values

          # બધી Kotlin ફાઇલો પેકેજમાં ખસેડો
          mv *.kt app/src/main/java/com/sarvadiverse/husenhisab/ 2>/dev/null || true

          # AndroidManifest અને google-services.json
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f google-services.json ] && cp google-services.json app/

          # App મોડ્યુલ માટે build.gradle.kts
          if [ -f build.gradle.kts ]; then
            cp build.gradle.kts app/build.gradle.kts
            cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
              id("com.google.gms.google-services") version "4.4.0" apply false
          }
          EOF
          fi

          echo 'include(":app")' > settings.gradle.kts

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-APK
          path: "app/build/outputs/apk/debug/*.apk"
          
