name: Build Husen Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Reorganize Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/sarvadiverse/husenhisab
          mkdir -p app/src/main/res/values

          # Kotlin ફાઇલો પેકેજ ફોલ્ડરમાં મોકલો
          mv *.kt app/src/main/java/com/sarvadiverse/husenhisab/ 2>/dev/null || true

          # મેનિફેસ્ટ અને સર્વિસ ફાઇલ ખસેડો
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f google-services.json ] && cp google-services.json app/

          # Root settings.gradle.kts તૈયાર કરો
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HusenHisab"
          include(":app")
          EOF

          # Root build.gradle.kts તૈયાર કરો
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.google.gms.google-services") version "4.4.1" apply false
          }
          EOF

          # App build.gradle.kts સેટ કરો
          if [ -f "build.gradle.kts" ]; then
            cp build.gradle.kts app/build.gradle.kts
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-APK
          path: "app/build/outputs/apk/debug/*.apk"
