name: Build Husen Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Fix Packages and Build Architecture
        run: |
          # 1. એક જ મુખ્ય પેકેજ ફોલ્ડર બનાવો
          mkdir -p app/src/main/java/com/sarvadiverse/husenhisab/ui/theme
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          # 2. FileProvider માટે XML
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="my_images" path="." />
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF

          # 3. XML Resources
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Husen Hisab</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.HusenHisab" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFD700" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          # 4. Theme & Color ને ui/theme માં મૂકો
          [ -f Theme.kt ] && mv Theme.kt app/src/main/java/com/sarvadiverse/husenhisab/ui/theme/
          [ -f Color.kt ] && mv Color.kt app/src/main/java/com/sarvadiverse/husenhisab/ui/theme/

          # 5. બાકી બધી Kotlin ફાઇલો એક જ ફોલ્ડરમાં મૂકો
          mv *.kt app/src/main/java/com/sarvadiverse/husenhisab/ 2>/dev/null || true

          # 6. તમામ એરર આપતા ખોટા Imports કાઢી નાખો
          sed -i '/import com.sarvadiverse.husenhisab.model/d' app/src/main/java/com/sarvadiverse/husenhisab/*.kt 2>/dev/null || true
          sed -i '/import com.sarvadiverse.husenhisab.viewmodel/d' app/src/main/java/com/sarvadiverse/husenhisab/*.kt 2>/dev/null || true
          
          # બધી ફાઇલોનું પેકેજ નેમ એક સરખું com.sarvadiverse.husenhisab કરી દો
          sed -i 's/^package .*/package com.sarvadiverse.husenhisab/' app/src/main/java/com/sarvadiverse/husenhisab/*.kt 2>/dev/null || true

          # 7. MainActivity ને સાચી રીતે ઓટો-જનરેટ કરો
          cat << 'EOF' > app/src/main/java/com/sarvadiverse/husenhisab/MainActivity.kt
          package com.sarvadiverse.husenhisab

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.lifecycle.ViewModelProvider
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Surface
          import androidx.compose.ui.Modifier
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.rememberNavController
          import com.sarvadiverse.husenhisab.ui.theme.HusenHisabTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  val viewModel = ViewModelProvider(this)[AppViewModel::class.java]

                  setContent {
                      HusenHisabTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = MaterialTheme.colorScheme.background
                          ) {
                              val navController = rememberNavController()

                              NavHost(
                                  navController = navController,
                                  startDestination = "dashboard"
                              ) {
                                  composable("dashboard") {
                                      DashboardScreen(navController = navController, viewModel = viewModel)
                                  }
                                  composable("daily_work") {
                                      DailyWorkScreen(navController = navController, viewModel = viewModel)
                                  }
                                  composable("ledger") {
                                      LedgerScreen(navController = navController, viewModel = viewModel)
                                  }
                                  composable("reports") {
                                      ReportsScreen(navController = navController, viewModel = viewModel)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          # 8. AndroidManifest
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/

          # 9. Dummy google-services.json
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "husen-hisab-5b492",
              "storage_bucket": "husen-hisab-5b492.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.sarvadiverse.husenhisab"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_key" }],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # 10. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HusenHisab"
          include(":app")
          EOF

          # 11. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
              id("com.google.gms.google-services") version "4.4.0" apply false
          }
          EOF

          # 12. App build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.gms.google-services")
          }

          android {
              namespace = "com.sarvadiverse.husenhisab"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.sarvadiverse.husenhisab"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf("-opt-in=androidx.compose.material3.ExperimentalMaterial3Api")
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.4"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.activity:activity-ktx:1.8.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")
              implementation(platform("androidx.compose:compose-bom:2023.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")

              implementation(platform("com.google.firebase:firebase-bom:32.7.2"))
              implementation("com.google.firebase:firebase-firestore-ktx")
              implementation("com.google.firebase:firebase-auth-ktx")
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-APK
          path: "app/build/outputs/apk/debug/*.apk"
          
