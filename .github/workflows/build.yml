name: Build Husen Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inspect Files and Fix Structure
        run: |
          echo "=== ફાઇલ લિસ્ટ (રુટ) ==="
          ls -la
          echo "=== app અથવા src ક્યાં છે તે શોધો ==="
          find . -maxdepth 3 -type d

          # જો અંદર કોઈ ફોલ્ડરમાં app હોય તો તેને રુટ પર લાવો
          ACTUAL_APP=$(find . -mindepth 2 -maxdepth 3 -type d -name "app" | head -n 1)
          if [ -n "$ACTUAL_APP" ]; then
            PARENT=$(dirname "$ACTUAL_APP")
            echo "Found app inside $PARENT, moving contents up..."
            cp -rn "$PARENT"/* . || true
          fi

      - name: Generate Debug Keystore and Print SHA Keys
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          echo "=================== SHA KEYS ==================="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
          echo "================================================="

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-build-cache
          else
            gradle assembleDebug --no-build-cache
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
