name: Build Husen Hisab APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Reorganize Android Project Structure
        run: |
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/java/com/sarvadiverse/husenhisab/model app/src/main/java/com/sarvadiverse/husenhisab/viewmodel app/src/main/java/com/sarvadiverse/husenhisab/ui/screens app/src/main/java/com/sarvadiverse/husenhisab/ui/theme gradle/wrapper

          [ -f "AndroidManifest.xml" ] && mv AndroidManifest.xml app/src/main/
          [ -f "strings.xml" ] && mv strings.xml app/src/main/res/values/
          [ -f "file_paths.xml" ] && mv file_paths.xml app/src/main/res/xml/
          [ -f "google-services.json" ] && mv google-services.json app/
          [ -f "gradle-wrapper.properties" ] && mv gradle-wrapper.properties gradle/wrapper/

          [ -f "MainActivity.kt" ] && mv MainActivity.kt app/src/main/java/com/sarvadiverse/husenhisab/
          [ -f "Models.kt" ] && mv Models.kt app/src/main/java/com/sarvadiverse/husenhisab/model/
          [ -f "AppViewModel.kt" ] && mv AppViewModel.kt app/src/main/java/com/sarvadiverse/husenhisab/viewmodel/
          [ -f "Color.kt" ] && mv Color.kt app/src/main/java/com/sarvadiverse/husenhisab/ui/theme/
          [ -f "Theme.kt" ] && mv Theme.kt app/src/main/java/com/sarvadiverse/husenhisab/ui/theme/
          [ -f "LoginScreen.kt" ] && mv LoginScreen.kt app/src/main/java/com/sarvadiverse/husenhisab/ui/screens/
          [ -f "DashboardScreen.kt" ] && mv DashboardScreen.kt app/src/main/java/com/sarvadiverse/husenhisab/ui/screens/
          [ -f "DailyWorkScreen.kt" ] && mv DailyWorkScreen.kt app/src/main/java/com/sarvadiverse/husenhisab/ui/screens/
          [ -f "LedgerScreen.kt" ] && mv LedgerScreen.kt app/src/main/java/com/sarvadiverse/husenhisab/ui/screens/
          [ -f "ReportsScreen.kt" ] && mv ReportsScreen.kt app/src/main/java/com/sarvadiverse/husenhisab/ui/screens/

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="shared_reports" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">હુસેન હિસાબ</string>
          </resources>
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.google.gms.google-services") version "4.4.1" apply false
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Husen Hisab"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.gms.google-services")
          }
          android {
              namespace = "com.sarvadiverse.husenhisab"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.sarvadiverse.husenhisab"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation(platform("com.google.firebase:firebase-bom:32.7.4"))
              implementation("com.google.firebase:firebase-auth-ktx")
              implementation("com.google.firebase:firebase-firestore-ktx")
          }
          EOF

         - name: Generate Debug Keystore and Print SHA Keys
     run: |
       mkdir -p ~/.android
       keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
       echo "=================== SHA KEYS ==================="
       keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
       echo "================================================="


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Debug APK
        run: gradle clean assembleDebug --no-build-cache


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-APK
          path: app/build/outputs/apk/debug/*.apk
          
