name: Build Husen Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Reorganize Android Project Structure
        run: |
          # જો app ફોલ્ડર સીધું નથી, તો તેને શોધીને રુટ પર લાવો
          if [ ! -d "app" ]; then
            APP_PATH=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              PARENT_DIR=$(dirname "$APP_PATH")
              echo "Moving files from $PARENT_DIR to root..."
              cp -r "$PARENT_DIR"/* . || true
            fi
          fi
          echo "Files in root directory:"
          ls -la

      - name: Generate Debug Keystore and Print SHA-1
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          echo "=================== SHA KEYS ==================="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
          echo "================================================="

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-APK
          path: app/build/outputs/apk/debug/*.apk
          
