name: Build Husen Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Prepare Clean Android Project
        run: |
          mkdir -p app/src/main/java/com/sarvadiverse/husenhisab/ui/theme
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          # FileProvider XML
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="my_images" path="." />
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF

          # Resources
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Husen Hisab</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.HusenHisab" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFD700" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          # Theme & Color ફાઇલો
          [ -f Theme.kt ] && mv Theme.kt app/src/main/java/com/sarvadiverse/husenhisab/ui/theme/
          [ -f Color.kt ] && mv Color.kt app/src/main/java/com/sarvadiverse/husenhisab/ui/theme/

          # બાકીની તમામ Kotlin ફાઇલો પેકેજમાં મૂકો
          for file in *.kt; do
            if [ -f "$file" ]; then
              mv "$file" app/src/main/java/com/sarvadiverse/husenhisab/
            fi
          done

          # તમામ ફાઇલોમાં પેકેજ સાચું છે તે સુનિશ્ચિત કરો
          sed -i '1s/^package.*/package com.sarvadiverse.husenhisab/' app/src/main/java/com/sarvadiverse/husenhisab/*.kt 2>/dev/null || true
          sed -i '1s/^package.*/package com.sarvadiverse.husenhisab.ui.theme/' app/src/main/java/com/sarvadiverse/husenhisab/ui/theme/*.kt 2>/dev/null || true

          # AndroidManifest
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/

          # google-services.json
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "husen-hisab-5b492",
              "storage_bucket": "husen-hisab-5b492.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.sarvadiverse.husenhisab"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_key" }],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HusenHisab"
          include(":app")
          EOF

          # Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
              id("com.google.gms.google-services") version "4.4.0" apply false
          }
          EOF

          # App build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.gms.google-services")
          }

          android {
              namespace = "com.sarvadiverse.husenhisab"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.sarvadiverse.husenhisab"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf("-opt-in=androidx.compose.material3.ExperimentalMaterial3Api")
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.4"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.activity:activity-ktx:1.8.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")
              implementation(platform("androidx.compose:compose-bom:2023.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")

              implementation(platform("com.google.firebase:firebase-bom:32.7.2"))
              implementation("com.google.firebase:firebase-firestore-ktx")
              implementation("com.google.firebase:firebase-auth-ktx")
          }
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-APK
          path: "app/build/outputs/apk/debug/*.apk"
          
