name: Build Husen Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate and Setup Android Project
        run: |
          echo "Current directory contents:"
          ls -la
          # Find directory containing settings.gradle or build.gradle
          SETTINGS_DIR=$(find . -maxdepth 3 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname || echo ".")
          echo "Found project root at: $SETTINGS_DIR"
          if [ "$SETTINGS_DIR" != "." ]; then
            cp -rn $SETTINGS_DIR/* . || true
          fi
          # Ensure gradlew has execute permission
          chmod +x gradlew || true

      - name: Generate Debug Keystore and Print SHA Keys
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          echo "=================== SHA KEYS ==================="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"
          echo "================================================="

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
