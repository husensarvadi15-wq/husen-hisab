name: Build Husen Hisab APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Organize Android Project Files
        run: |
          mkdir -p app/src/main/java/com/sarvadiverse/husenhisab
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          # Move all Kotlin files to package path
          mv *.kt app/src/main/java/com/sarvadiverse/husenhisab/ 2>/dev/null || true

          # Move Manifest and json
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f google-services.json ] && cp google-services.json app/

          # Move gradle wrapper
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/

          # Setup root and app build files
          if [ -f build.gradle.kts ]; then
            cp build.gradle.kts app/build.gradle.kts
            cat << 'EOF' > build.gradle.kts
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.android) apply false
              alias(libs.plugins.google.gms.google.services) apply false
          }
          EOF
          fi

          echo 'include(":app")' > settings.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HusenHisab-APK
          path: "app/build/outputs/apk/debug/*.apk"
          
